[advisories]
yanked = "deny"
unmaintained = "none"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "OFL-1.1",
]
exceptions = [{ allow = ["CDLA-Permissive-2.0"], name = "webpki-roots" }]

[bans]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
