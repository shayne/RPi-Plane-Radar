min_version = "2026.7.7"

[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"
CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER = "/usr/bin/clang"
CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER = "/usr/bin/clang"
_.file = { path = ".env", redact = true }

[tools]
rust = "1.97.1"
cmake = "4.3.3"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-nextest" = "0.9.140"

[tasks.fmt]
run = "cargo fmt --all --check"

[tasks.lint]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
run = "cargo nextest run --workspace --all-features"

[tasks.deny]
run = "cargo deny check"

[tasks.verify]
depends = ["fmt", "lint", "test", "deny"]

[tasks.package-release]
run = './scripts/package-release.sh "$@"'

[tasks.validate-release-metadata]
run = './scripts/validate-release-metadata.sh "$@"'

[tasks.docs-check]
run = "cargo test --locked --test docs_contract"

[tasks.readme-commands]
depends = ["docs-check"]

[tasks.install]
run = 'cargo run --locked -p planeradarctl -- install "$@"'

[tasks.upgrade]
run = 'cargo run --locked -p planeradarctl -- upgrade "$@"'

[tasks.status]
run = 'cargo run --locked -p planeradarctl -- status "$@"'

[tasks.doctor]
run = 'cargo run --locked -p planeradarctl -- doctor "$@"'

[tasks.screenshot]
run = 'cargo run --locked -p planeradarctl -- screenshot "$@"'

[tasks.smoke-verify]
run = 'cargo run --locked -p planeradarctl -- smoke-verify "$@"'

[tasks.rollback]
run = 'cargo run --locked -p planeradarctl -- rollback "$@"'

[tasks.uninstall]
run = 'cargo run --locked -p planeradarctl -- uninstall "$@"'

[tasks."driver:sync"]
run = "cargo run --locked -p planeradarctl -- driver sync"

[tasks."driver:update"]
run = 'cargo run --locked -p planeradarctl -- driver update "$@"'

[tasks.refresh-airports]
run = '''
set -euo pipefail
refresh_dir="$(mktemp -d src/assets/.refresh-airports.XXXXXX)"
trap 'rm -rf "$refresh_dir"' EXIT
curl --fail --location --proto '=https' --tlsv1.2 \
  https://ourairports.com/data/airports.csv \
  --output "$refresh_dir/airports.csv"
curl --fail --location --proto '=https' --tlsv1.2 \
  https://ourairports.com/data/runways.csv \
  --output "$refresh_dir/runways.csv"
printf 'OurAirports retrieval date: %s\n' "$(date -u +%Y-%m-%d)"
shasum -a 256 "$refresh_dir/airports.csv" "$refresh_dir/runways.csv"
cargo run --locked --bin build-airports -- \
  "$refresh_dir/airports.csv" \
  "$refresh_dir/runways.csv" \
  "$refresh_dir/large_airports.json.gz"
mv "$refresh_dir/large_airports.json.gz" src/assets/large_airports.json.gz
'''

[tasks.build-pi]
run = "./scripts/build-pi.sh"

[tasks.deploy-pi]
depends = ["build-pi"]
run = "./scripts/deploy-pi.sh"

[tasks.smoke-pi]
run = "./scripts/smoke-pi.sh"
