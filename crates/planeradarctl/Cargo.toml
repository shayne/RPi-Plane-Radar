[package]
name = "planeradarctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
nix = { version = "0.30", features = ["fs"] }
png = "0.18"
rand = "0.9"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.8"
zstd = "0.13"

[dev-dependencies]
jsonschema = { version = "0.37", default-features = false }
