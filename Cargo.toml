[package]
name = "planeradar"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
build = "build.rs"
default-run = "planeradar"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
flate2 = "1.1"
fontdue = "0.9"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.30", features = ["net", "signal"] }
png = "0.18"
qrcode = "0.14"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tiny_http = "0.12"
tiny-skia = "0.11"
ureq = { version = "3.1", features = ["json"] }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = "0.38"
